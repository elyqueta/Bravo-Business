<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="assets/images/logo.jpeg" alt="logo">
      <h1>BRAVO<em>BUSINESS</em></h1>
      <p>Acesso ao Backoffice</p>
    </div>
    <form class="login-form" (ngSubmit)="submit()" #f="ngForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-input" [(ngModel)]="email" name="email" required email placeholder="admin@bravo.com">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" class="form-input" [(ngModel)]="password" name="password" required minlength="6" placeholder="••••••">
      </div>
      <div class="login-error" *ngIf="error">{{ error }}</div>
      <button type="submit" class="login-btn" [disabled]="loading">
        <i class="fa-solid fa-right-to-bracket"></i> {{ loading ? 'A entrar...' : 'Entrar' }}
      </button>
    </form>
    <div class="login-hint">
      <strong>Demo:</strong> admin@bravo.com / admin123
    </div>
  </div>
</div>
