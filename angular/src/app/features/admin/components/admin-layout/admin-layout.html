<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <img src="assets/images/logo.jpeg" alt="logo" class="admin-sidebar-logo">
      <span class="admin-sidebar-brand">BRAVO<em>BUSINESS</em></span>
    </div>
    <nav class="admin-nav">
      <a routerLink="/admin/dashboard" routerLinkActive="active">
        <i class="fa-solid fa-chart-line"></i> Dashboard
      </a>
      <a routerLink="/admin/products" routerLinkActive="active">
        <i class="fa-solid fa-box"></i> Produtos
      </a>
      <a routerLink="/admin/orders" routerLinkActive="active">
        <i class="fa-solid fa-receipt"></i> Pedidos
      </a>
      <a routerLink="/shop/home">
        <i class="fa-solid fa-store"></i> Ver Loja
      </a>
    </nav>
    <div class="p-4 border-t border-gray-800">
      <a class="logout-btn" (click)="auth.logout()">
        <i class="fa-solid fa-right-from-bracket"></i> Sair
      </a>
    </div>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <h1>Backoffice</h1>
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-500">{{ auth.currentUser?.name }}</span>
        <div class="w-8 h-8 rounded-full bg-amber-500 flex items-center justify-center text-white text-sm font-bold">
          {{ auth.currentUser?.name?.charAt(0) }}
        </div>
      </div>
    </header>
    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
    <footer class="admin-footer">
      © {{ year }} Bravo Business. Backoffice.
    </footer>
  </div>
</div>
