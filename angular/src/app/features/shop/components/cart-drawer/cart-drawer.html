<div class="drw-overlay" id="cartOv" [class.on]="isOpen" (click)="close()"></div>
<div class="drw" id="cartDrw" [class.on]="isOpen">
  <div class="drw-hd">
    <span class="drw-title"><i class="fa-solid fa-bag-shopping"></i> Carrinho</span>
    <button class="drw-close" (click)="close()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="drw-body" id="cartBody">
    <div class="drw-empty" id="cartEmpty" *ngIf="items.length === 0">
      <i class="fa-solid fa-bag-shopping"></i>
      <p>O teu carrinho está vazio.<br>Adiciona produtos para começar!</p>
    </div>
    <div id="cartItems" *ngIf="items.length > 0">
      <div class="ditem" *ngFor="let item of items">
        <div class="ditem-img"><img [src]="item.img" [alt]="item.name"></div>
        <div class="ditem-info">
          <p class="ditem-code">{{ item.id }}</p>
          <p class="ditem-name">{{ item.name }}</p>
          <div class="ditem-ctrl">
            <div class="qty">
              <button class="qbtn" (click)="chQty(item.id, -1)"><i class="fa-solid fa-minus" style="font-size:9px"></i></button>
              <span class="qnum">{{ item.qty }}</span>
              <button class="qbtn" (click)="chQty(item.id, 1)"><i class="fa-solid fa-plus" style="font-size:9px"></i></button>
            </div>
            <button class="btn-rm" (click)="rmCart(item.id)"><i class="fa-solid fa-trash-can" style="font-size:9px"></i> Remover</button>
          </div>
        </div>
        <div class="ditem-price">{{ global.fmt(item.price * item.qty) }}</div>
      </div>
    </div>
  </div>
  <div class="drw-ft" id="cartFt" *ngIf="items.length > 0">
    <div class="drw-total">
      <span class="lbl">Total</span>
      <span class="val">{{ global.fmt(total) }}</span>
    </div>
    <p class="drw-note"><i class="fa-solid fa-circle-info" style="color:var(--accent);margin-right:4px"></i>O pedido é confirmado via WhatsApp. Um agente validará disponibilidade e entrega.</p>
    <button class="btn-wa" id="waBtn" (click)="checkoutWhatsApp()"><i class="fa-brands fa-whatsapp"></i>Finalizar via WhatsApp</button>
  </div>
</div>
