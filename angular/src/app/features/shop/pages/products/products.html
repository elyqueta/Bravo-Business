<app-category-nav (selectedCategory)="onCategory($event)"></app-category-nav>

<section class="products-page">
  <div class="max-w-7xl mx-auto px-4 py-12">
    <div class="text-center mb-10">
      <h2 class="font-display text-5xl text-gray-900">TODOS OS<br><em class="text-amber-500">PRODUTOS</em></h2>
      <p class="text-gray-500 mt-3">Descobre a nossa coleção completa</p>
    </div>

    <div *ngIf="loading()" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <div *ngFor="let _ of [1,2,3,4,5,6,7,8]" class="bg-gray-100 rounded-2xl aspect-[3/4] animate-pulse"></div>
    </div>

    <div *ngIf="!loading()" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <app-product-card *ngFor="let p of filtered()" [product]="p" (onSelect)="openProduct($event)"></app-product-card>
    </div>

    <div *ngIf="!loading() && filtered().length === 0" class="text-center py-20 text-gray-400">
      <i class="fa-solid fa-box-open text-5xl mb-4"></i>
      <p>Nenhum produto encontrado nesta categoria.</p>
    </div>
  </div>
</section>
