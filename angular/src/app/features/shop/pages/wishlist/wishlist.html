<section class="wishlist-page">
  <div class="max-w-5xl mx-auto px-4 py-12">
    <h1 class="font-display text-5xl text-gray-900 mb-8">OS TEUS<br><em class="text-amber-500">FAVORITOS</em></h1>

    <div *ngIf="items.length === 0" class="text-center py-20 bg-white rounded-3xl">
      <i class="fa-regular fa-heart text-6xl text-gray-200 mb-4"></i>
      <p class="text-gray-500 text-lg">Ainda não tens favoritos.</p>
      <a routerLink="/products" class="btn-primary mt-6 inline-flex">Explorar Produtos</a>
    </div>

    <div *ngIf="items.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let item of items" class="bg-white rounded-2xl p-4 flex gap-4 border border-gray-100">
        <div class="w-24 h-24 rounded-xl bg-gray-100 overflow-hidden flex-shrink-0">
          <img [src]="item.image" [alt]="item.name" class="w-full h-full object-cover">
        </div>
        <div class="flex-1">
          <h3 class="font-semibold text-gray-900">{{ item.name }}</h3>
          <p class="text-amber-600 font-semibold">{{ item.price.toLocaleString('pt-AO') }} Kz</p>
          <button class="text-red-500 text-sm mt-2" (click)="remove(item.id)">
            <i class="fa-solid fa-trash"></i> Remover
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="items.length > 0" class="text-center mt-8">
      <button class="btn-wa" (click)="checkoutWhatsApp()">
        <i class="fa-brands fa-whatsapp"></i> Pedir Favoritos via WhatsApp
      </button>
    </div>
  </div>
</section>
