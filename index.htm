<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bravo Business</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
    html{scroll-behavior:smooth}
    body{background:#fff;color:#111}

    header{
      display:flex;justify-content:space-between;align-items:center;
      padding:20px 40px;background:#fff;border-bottom:1px solid #eee;
      position:sticky;top:0;z-index:1000
    }

    header h1{font-size:22px;font-weight:700}

    nav a{
      margin:0 15px;text-decoration:none;color:#111;font-weight:500;
      position:relative
    }

    nav a::after{
      content:'';position:absolute;left:0;bottom:-5px;width:0;height:2px;background:#000;transition:0.3s
    }

    nav a:hover::after{width:100%}

    .hero{
      height:70vh;
      background:url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      filter:grayscale(100%);
      display:flex;align-items:center;padding:60px;color:#fff
    }

    .hero-content{
      background:rgba(0,0,0,0.6);
      padding:30px;border-radius:10px
    }

    .hero h2{font-size:42px;font-weight:700}

    .btn{
      display:inline-block;margin-top:15px;padding:12px 25px;
      background:#000;color:#fff;text-decoration:none;border-radius:5px
    }

    .section{padding:60px 40px}

    .section h2{margin-bottom:30px}

    .products{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:25px
    }

    .card{
      border:1px solid #eee;padding:15px;border-radius:10px;text-align:center;
      transition:0.3s
    }

    .card:hover{transform:translateY(-5px)}

    .card img{
      width:100%;height:180px;object-fit:cover;
      filter:grayscale(100%)
    }

    .card h3{margin:10px 0}

    .card button{
      margin-top:10px;padding:10px;width:100%;
      background:#000;color:#fff;border:none;border-radius:5px;cursor:pointer
    }

    .cart{
      position:fixed;bottom:0;width:100%;background:#fff;padding:15px;
      border-top:1px solid #eee
    }

    .cart-items{max-height:120px;overflow:auto;margin-bottom:10px}

    footer{
      background:#111;color:#fff;padding:40px;margin-top:80px
    }

    .footer-grid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;
      margin-bottom:200px;
    }

    .footer-grid h3{margin-bottom:10px}

    .socials i{
      margin-right:10px;font-size:20px;cursor:pointer
    }

    @media(max-width:600px){
      .hero h2{font-size:28px}
      header{flex-direction:column}
    }
  </style>
</head>
<body>

<header>
  <h1>Bravo Business</h1>
  <nav>
    <a href="#produtos">Produtos</a>
    <a href="#contacto">Contacto</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h2>COMPRE AGORA</h2>
    <p>Estilo, qualidade e preço justo</p>
    <a href="#produtos" class="btn">Explorar</a>
  </div>
</section>

<section id="produtos" class="section">
  <h2>Produtos</h2>
  <div class="products" id="products"></div>
</section>

<div class="cart">
  <div class="cart-items" id="cartItems"></div>
  <strong>Total: <span id="total">0</span> Kz</strong><br>
  <button onclick="sendWhatsApp()" class="btn">Enviar para WhatsApp</button>
</div>

<footer id="contacto">
  <div class="footer-grid">
    <div>
      <h3>Sobre</h3>
      <p>Bravo Business - Loja moderna (protótipo).</p>
    </div>

    <div>
      <h3>Contacto</h3>
      <p>Telefone: (+244) ___ ___ ___</p>
      <p>Email: contacto@bravo.com</p>
      <p>Localização: Luanda, Angola</p>
    </div>

    <div>
      <h3>Redes Sociais</h3>
      <div class="socials">
        <i class="fab fa-whatsapp" onclick="goWhats()"></i>
        <i class="fab fa-instagram" onclick="goInsta()"></i>
        <i class="fab fa-facebook" onclick="goFace()"></i>
        <i class="fab fa-tiktok" onclick="goTikTok()"></i>
      </div>
    </div>
  </div>
</footer>

<script>
const products = [
  {name:"Tênis Running", price:15000, img:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519"},
  {name:"Tênis Sport", price:18000, img:"https://images.unsplash.com/photo-1584735175315-9d5df23860e6"},
  {name:"Casaco Preto", price:12000, img:"https://images.unsplash.com/photo-1520975922203-bf6a4f4c61b4"},
  {name:"Bola Basquete", price:9000, img:"https://images.unsplash.com/photo-1517649763962-0c623066013b"}
];

let cart = [];
const container = document.getElementById("products");

products.forEach((p,i)=>{
  container.innerHTML += `
  <div class="card">
    <img src="${p.img}">
    <h3>${p.name}</h3>
    <p>${p.price} Kz</p>
    <button onclick="addToCart(${i})">Adicionar</button>
  </div>`;
});

function addToCart(i){
  cart.push(products[i]);
  renderCart();
}

function renderCart(){
  const cartItems = document.getElementById("cartItems");
  const totalEl = document.getElementById("total");
  cartItems.innerHTML = "";
  let total = 0;

  cart.forEach(item=>{
    total += item.price;
    cartItems.innerHTML += `<div>${item.name} - ${item.price} Kz</div>`;
  });

  totalEl.innerText = total;
}

function sendWhatsApp(){
  let msg = "Pedido:%0A";
  let total = 0;

  cart.forEach(item=>{
    msg += `- ${item.name}: ${item.price} Kz%0A`;
    total += item.price;
  });

  msg += `%0ATotal: ${total} Kz`;

  window.open(`https://wa.me/244944692599?text=${msg}`);
}

function goWhats(){window.open("https://wa.me/244944692599")}
function goInsta(){window.open("https://instagram.com/")}
function goFace(){window.open("https://facebook.com/")}
function goTikTok(){window.open("https://tiktok.com/")}
</script>

</body>
</html>
