  <section class="admin-content">
    <header class="admin-topbar">
      <div>
        <span class="eyebrow">Bravo Business · Catálogo</span>
        <h1>{{ editingId ? "Editar categoria" : "Nova categoria" }}</h1>
        <p>Define como a categoria aparece na loja.</p>
      </div>
      <a routerLink="/admin/categorias" class="admin-secondary"
        ><i class="fa-solid fa-arrow-left"></i> Voltar</a
      >
    </header>
    <form
      class="admin-form admin-form-page category-form-page"
      [formGroup]="form"
      (ngSubmit)="save()"
      [class.form-locked]="submitState() === 'submitting'"
    >
      <fieldset [disabled]="submitState() === 'submitting'">
        <app-form-field
          caption="Nome"
          [state]="form.controls.label.touched && form.controls.label.invalid ? 'error' : 'default'"
        >
          <input formControlName="label" placeholder="Roupas" />
        </app-form-field>
        <app-form-field
          caption="Prefixo"
          [state]="form.controls.prefix.touched && form.controls.prefix.invalid ? 'error' : 'default'"
        >
          <input
            formControlName="prefix"
            maxlength="1"
            placeholder="R" />
        </app-form-field>
        <app-form-field
          caption="Ícone Font Awesome"
          [helpText]="form.controls.icon.value || 'fa-box'"
        >
          <button
            type="button"
            class="icon-picker-trigger"
            (click)="openIconPicker()"
          >
            <i class="fa-solid" [ngClass]="form.controls.icon.value"></i
            ><span>{{ form.controls.icon.value }}</span
            ><i class="fa-solid fa-chevron-down"></i></button>
        </app-form-field>
        <app-form-field
          caption="Âncora"
          [state]="form.controls.anchor.touched && form.controls.anchor.invalid ? 'error' : 'default'"
        >
          <input formControlName="anchor" placeholder="s-roupas" />
        </app-form-field>
      </fieldset>
      <div class="admin-form-actions wide">
        <button class="admin-primary" type="submit" [disabled]="submitState() === 'submitting'" [class.is-success]="submitState() === 'success'">
          @switch (submitState()) {
            @case ('submitting') { <i class="fa-solid fa-spinner fa-spin"></i> A guardar... }
            @case ('success') { <i class="fa-solid fa-circle-check"></i> Guardado! }
            @default { <i class="fa-solid fa-floppy-disk"></i> {{ editingId ? 'Guardar alterações' : 'Criar categoria' }} }
          }
        </button>
      </div>
    </form>
  </section>
<div
  class="icon-picker-overlay"
  *ngIf="iconPickerOpen()"
  (click)="iconPickerOpen.set(false)"
>
  <section class="icon-picker-modal" (click)="$event.stopPropagation()">
    <header>
      <div>
        <span class="eyebrow">Visual selector</span>
        <h2>Escolhe um ícone</h2>
      </div>
      <button type="button" (click)="iconPickerOpen.set(false)">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </header>
    <div class="icon-picker-grid">
      <button
        type="button"
        *ngFor="let icon of iconOptions"
        [class.selected]="form.controls.icon.value === icon"
        (click)="selectIcon(icon)"
      >
        <i class="fa-solid" [ngClass]="icon"></i
        ><span>{{ icon.replace("fa-", "") }}</span>
      </button>
    </div>
  </section>
</div>
