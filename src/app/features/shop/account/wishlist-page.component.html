<section class="page-hero">
  <div>
    <span class="eyebrow">A tua selecção</span>
    <h1>Favoritos</h1>
    <p>Guarda as peças que queres rever mais tarde.</p>
  </div>
</section>
<main class="catalog-page">
  <div class="empty-state" *ngIf="!products().length">
    <i class="fa-regular fa-heart"></i>
    <h2>Nenhum favorito ainda</h2>
    <p>Explora a loja e guarda os teus produtos preferidos.</p>
    <a routerLink="/loja/produtos" class="btn-prim">Explorar produtos</a>
  </div>
  <div class="wishlist-toolbar" *ngIf="products().length">
    <span
      >{{ products().length }}
      {{
        products().length === 1 ? "produto guardado" : "produtos guardados"
      }}</span
    >
    <button class="btn-clear" type="button" (click)="clear()">
      <i class="fa-solid fa-trash-can"></i> Limpar favoritos
    </button>
  </div>
  <div class="pgrid" *ngIf="products().length">
    <div class="wishlist-item" *ngFor="let product of products()">
      <app-product-card [product]="product"></app-product-card>
      <button
        class="wishlist-remove"
        type="button"
        (click)="remove(product.id)"
        [attr.aria-label]="'Remover ' + product.name + ' dos favoritos'"
      >
        <i class="fa-solid fa-trash-can"></i>
      </button>
    </div>
  </div>
</main>
